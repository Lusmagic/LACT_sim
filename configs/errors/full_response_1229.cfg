# Official full-response smoke-test errors for the 1229 telescope.
#
# These are deliberately small, non-calibrated values. They exist to exercise
# all currently implemented error paths in one reproducible CORSIKA run.
random_seed=987654321

# Elevation-dependent support deformation. The series is evaluated at the
# current telescope.pointing_el_deg and overwrites the ideal facet center/normal.
structural_deformation_config=../mirrors/mirror_1229_elevation_series.cfg

# Random per-facet / per-ray perturbations.
facet_radial_position_sigma_m=0.002
facet_normal_sigma_deg=0.01
reflect_direction_sigma_deg=0.0179
radius_of_curvature_sigma_m=0.02
reflectivity_scale_sigma=0.02
