# CORSIKA/EventIO full-response real-camera trace.
#
# Includes:
#   - elevation-dependent mirror structural deformation
#   - small random optical error terms
#   - mirror reflectivity, filter transmission, and SiPM PDE curves
#   - new_camera pixel layout and Bezier square-cone light collector
#   - simple multiplicity trigger
#
# NSB is intentionally disabled here. This test isolates optical response plus
# trigger; the separate corsika_nsb_trigger_camera.cfg covers NSB+trigger.
telescope.config=telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/example_simple_multiplicity.cfg
error.config=../errors/full_response_1229.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact
propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/official_tests/corsika/camera_full_response_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=false
output.save_only_triggered=true

# Official full-response trigger setting.
trigger.pixel_threshold_pe=10
