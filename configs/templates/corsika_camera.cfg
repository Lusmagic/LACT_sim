# Template: CORSIKA/EventIO photon bunches through ideal 1229 optics and new_camera.
# Run with:
#   build/run_corsika_trace configs/templates/corsika_camera.cfg /path/to/input.zst
telescope.config=../official_tests/telescope_1229_minimal.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
electronics.config=../electronics/ideal_pe.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg

# Set these from the CORSIKA file direction:
#   pointing_el_deg = 90 - zenith
#   pointing_az_deg = azimuth
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact

# Optional server-debug controls:
# source.max_shower_events=1
# source.filter_shower_event_id=327666
propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/template_corsika_camera/corsika_trace.h5
output.hdf5_storage=dense
output.hdf5_write_components=false

# For debugging or regression tests, use output.format=csv or both.
output.pixel_csv=run_logs/template_corsika_camera/camera_pixels.csv
output.summary_csv=run_logs/template_corsika_camera/corsika_trace_summary.csv
