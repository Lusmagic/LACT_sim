# Minimal CORSIKA/EventIO -> LACT optics -> dense new_camera p.e. image.
# User normally edits only:
#   source.eventio_path
#   telescope.pointing_az_deg / telescope.pointing_el_deg
#   output.hdf5_path
#
# Run:
#   build/run_corsika_trace configs/templates/minimal_corsika_camera.cfg
# or:
#   build/run_corsika_trace configs/templates/minimal_corsika_camera.cfg /path/to/input.zst

telescope.config=../official_tests/telescope_1229_minimal.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
electronics.config=../electronics/ideal_pe.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg

# Pointing convention:
#   pointing_el_deg = 90 - CORSIKA zenith
#   pointing_az_deg = CORSIKA azimuth, using the LACT_sim convention described
#                     in docs/coordinate_systems.md
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

source.mode=EventIO
source.eventio_path=
source.eventio_coordinate_frame=corsika_iact
source.event_id_mode=event_array100

# Optional quick checks:
# source.max_shower_events=1
# source.filter_shower_event_id=327666

# Current local telescope optical-path timing. Full atmospheric refractive-index
# timing is a reserved interface, not enabled by default.
propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/minimal_corsika_camera/camera_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=false
