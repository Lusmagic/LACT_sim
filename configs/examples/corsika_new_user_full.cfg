# 完整的新用户示例：CORSIKA/EventIO -> 光追 -> new_camera 像素 p.e.
# 运行代码不需要修改，只需要改这个 cfg 里的输入/输出路径和必要结构文件。
#
# 典型运行：
#   build/run_corsika_trace configs/examples/corsika_new_user_full.cfg /path/to/input.zst
#
# 必须由用户提供或确认的结构文件：
#   mirror.csv_path  镜片布局
#   camera.csv_path  相机像素布局
# 其他效率、误差、电子学等都有默认值；不写就是理想或关闭。

# Telescope pointing. 这里用 zenith=20 deg, azimuth=0 deg 对应 elevation=70 deg。
telescope.id=0
telescope.name=LACT_1229_user_example
telescope.position_m=0,0,0
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
telescope.focal_length_m=8
telescope.coordinate_system=array

# Mirror geometry. Units are meters.
mirror.mode=csv
mirror.csv_path=configs/mirror_1229_facets.csv

# Focal-plane whiteboard/camera plane in telescope-local coordinates.
output.plane_point=0,0,-8
output.plane_normal=0,0,-1
output.plane_u_axis=1,0,0
output.plane_v_axis=0,1,0

# Real camera pixel geometry.
camera.enabled=true
camera.mode=csv
camera.csv_path=configs/cameras/new_camera_pixels.csv
camera.collector=bezier
camera.collector_material=true_reflect
camera.collector_exit_size_m=0.0130
camera.collector_height_m=0.0297

# SiPM and simple electronics.  Omit sipm.pde for ideal photon counting.
sipm.size_m=0.0130
sipm.pde=configs/efficiency/sipm_pde.csv

# Atmosphere interface.  CORSIKA photons are already at the telescope plane;
# this optional factor is an extra wavelength-dependent transmission.
# Use none, a constant, or a wavelength_nm/transmission CSV.
atmosphere.transmission=none
atmosphere.refractive_index_model=none
atmosphere.speed_of_light_correction=false

# CORSIKA/EventIO source.
source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100

# Coordinate convention:
#   corsika_iact     = hessio/CORSIKA IACT photon bunches. x/y are relative to
#                      each telescope, but still in the CORSIKA horizontal
#                      detection frame; the code rotates x/y/z and cx/cy/cz
#                      into the LACT telescope optical frame using pointing az/el.
#   telescope_local  = positions/directions are already in LACT optical frame.
#   array_global     = absolute global array coordinates; subtract telescope
#                      position, then rotate into the optical frame.
source.eventio_coordinate_frame=corsika_iact
source.use_eventio_telescope_position=true

# Optional for quick server checks:
# source.max_shower_events=1
# source.filter_shower_event_id=327666

# Output files.  Formal CORSIKA camera runs should use HDF5.  Use csv or both
# for debugging/regression checks against plain text output.
output.format=hdf5
output.hdf5_path=run_logs/new_user_corsika/corsika_trace.h5
output.hdf5_storage=dense
output.pixel_csv=run_logs/new_user_corsika/camera_pixel_image.csv
output.summary_csv=run_logs/new_user_corsika/corsika_trace_summary.csv

# Optional physics/electronics defaults. Leaving them out would give the same values.
propagation.speed_of_light_m_per_ns=0.299792458
