# On-axis point source 30 m in front of the standard whiteboard/camera plane.
# With the standard whiteboard at z=-8 m, this means source_position.z=22 m.
# Rays are sampled toward the telescope entrance plane z=0 over a 4 m radius disk.
mode=PointSource
n_bunches=1000000
multiplicity=1
wavelength_nm=400
time_ns=0
photon_weight=1
source_position=0,0,22
aperture_z=0
aperture_radius_m=4
random_seed=30000
