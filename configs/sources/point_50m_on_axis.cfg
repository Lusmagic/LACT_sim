# Finite-distance on-axis point source at 50 m in the telescope-local +z direction.
# The target plane remains aperture_z=0 with a 4 m radius sampling disk.
mode=PointSource
n_bunches=1000000
multiplicity=1
wavelength_nm=400
time_ns=0
photon_weight=1
source_position=0,0,50
aperture_z=0
aperture_radius_m=4
random_seed=50
