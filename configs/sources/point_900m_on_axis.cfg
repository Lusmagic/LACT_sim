# 理想有限距离点光源，先在望远镜本地坐标里定义。
# source_position 和 aperture_z 都是本地坐标，随后会随 telescope pointing 一起转到全局。
# 当前 target plane 仍按 cfg 显式设置，不会被程序自动替换成“理想入瞳面”。
mode=PointSource
n_bunches=1000000
multiplicity=1
wavelength_nm=400
time_ns=0
photon_weight=1
source_position=0,0,900
aperture_z=0
aperture_radius_m=4
random_seed=900
