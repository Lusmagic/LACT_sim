# CORSIKA/EventIO smoke test: one shower event through ideal LACT optics
# and the real new_camera pixel plane.  This file is intentionally small so
# it can be used quickly after moving the code to a new machine.

telescope.config=../official_tests/telescope_1229_minimal.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
electronics.config=../electronics/ideal_pe.cfg

# The test CORSIKA file name is zenith_20, azimuth_0.
# Telescope elevation is 90 deg - zenith.
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact
source.max_shower_events=1
propagation.speed_of_light_m_per_ns=0.299792458

output.format=both
output.hdf5_path=run_logs/corsika_hdf5_smoke/native_camera_dense.h5
output.hdf5_storage=dense
output.pixel_csv=run_logs/corsika_hdf5_smoke/camera_pixels.csv
output.summary_csv=run_logs/corsika_hdf5_smoke/corsika_trace_summary.csv
