# CORSIKA/EventIO timing smoke test.
# 开启 dense pixel 时间统计和 proxy waveform，用于检查相机时间输出接口。

telescope.config=../official_tests/telescope_1229_minimal.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
electronics.config=../electronics/ideal_pe.cfg

# 默认测试文件名是 zenith_20, azimuth_0，因此望远镜仰角设置为 70 deg。
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact
source.max_shower_events=1
propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/manual_checks/corsika_waveform_smoke/camera_waveform_dense.h5
output.hdf5_storage=dense
output.write_pixel_time_stats=true
output.summary_csv=run_logs/manual_checks/corsika_waveform_smoke/corsika_trace_summary.csv

waveform.enabled=true
waveform.source=pe
waveform.time_bin_width_ns=2
waveform.time_window_start_ns=-20
waveform.time_window_end_ns=120

# 逐光子 collector debug 输出默认关闭；小样本调试时可以打开。
collector.debug_photon_output=false
collector.debug_photon_csv=run_logs/manual_checks/corsika_waveform_smoke/collector_debug_photons.csv
collector.debug_max_photons=20000
