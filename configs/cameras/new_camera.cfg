# LACT new_camera 实际相机像素布局。
# pixel CSV 由 mapping_with_phyxy_sort.csv 转换而来：
#   phy_x/phy_y: cm -> m
#   pixel id: s_number
#   pixel shape: Square
#   pixel size: 2.44 cm
enabled=true
mode=csv
csv_path=configs/cameras/new_camera_pixels.csv

# 当前 new_camera 默认采用 SquareCone.hpp 中的 Bezier 曲面光收集器。
# 光收集器入口默认使用 pixel size，也就是 2.44 cm 的 square collector aperture。
collector=bezier
collector_material=true_reflect
# 可选：collector_reflectivity_csv 会覆盖 collector_material。
# 不设置时默认不使用外部表格。CSV 列名支持 theta_deg/angle_deg 和 reflectivity/efficiency。

# 光收集器几何参数，单位 m。
# true_reflect 是 SquareCone.hpp 中的经验反射率材料，不是 100% 理想反射。
collector_exit_size_m=0.0130
collector_height_m=0.0297
