# Ideal atmosphere placeholder.
# transmission can be:
#   none                  -> no atmospheric loss, factor = 1
#   0.92                  -> constant transmission
#   path/to/table.csv     -> wavelength_nm,transmission table
#
# CORSIKA photons are already at the telescope plane. This module is only an
# extra user-controlled transmission factor before telescope optics.
transmission=none

# Interface placeholders for future timing work. They are documented here so
# user cfg files can reserve the intended meaning; current ray tracing uses
# propagation.speed_of_light_m_per_ns for local telescope optical paths.
refractive_index_model=none
speed_of_light_correction=false
