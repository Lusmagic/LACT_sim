# ============================================================
# LACT Fast Reflectivity Simulation Configuration
# ============================================================

# ============================================================
# 1. Parallel source
# 实际平行光参数以本文件中的 source.* 为准
# ============================================================
source.mode=ParallelBeam
source.n_bunches=10000000
source.multiplicity=1
source.wavelength_nm=400
source.time_ns=0
source.photon_weight=1
source.source_plane_z=1.0
source.beam_radius_m=4.0
source.beam_direction=0.0,0.0,-1.0
source.random_seed=1229

# ============================================================
# 2. Detector position and pointing
# position_local：Detector 正面参考中心的望远镜局部坐标 [m]
# look_at_local：Detector 光轴指向的局部坐标点 [m]
# ============================================================
cmos.position_local=0.0,0.0,-16.0
cmos.look_at_local=0.0,0.0,-8.422808
cmos.up_reference_local=0.0,1.0,0.0

# ============================================================
# 3. Detector optical parameters
# ============================================================
cmos.focal_length_m=0.035
cmos.f_number=1.8
cmos.horizontal_fov_deg=14.33
cmos.vertical_fov_deg=10.77

# ============================================================
# 4. Detector mechanical geometry
#
# 主体：φ170 mm 圆盘
# 底座：宽 140 mm
# 底座在圆盘最低点以下露出 15 mm
# 底座左边缘距圆盘左边缘 6 mm
# 底座向上延伸至其顶部完全被圆盘覆盖
# 物理接收孔：φ21 mm
# 接收孔左边缘距圆盘左边缘 13 mm
# ============================================================
cmos.body_diameter_m=0.170
cmos.housing_depth_m=0.140
cmos.base_width_m=0.140
cmos.base_exposed_height_m=0.015
cmos.base_left_inset_m=0.006
cmos.physical_hole_diameter_m=0.021
cmos.physical_hole_left_edge_distance_m=0.013

# ============================================================
# 5. Diffuse target
#
# 500 mm × 500 mm 漫反射靶
# normal_global 指向 Lambert 出射半球，即当前朝向镜面
# ============================================================
target.center_global=0.0,0.0,-8.422808
target.normal_global=0.0,0.0,-1.0
target.width_m=0.500
target.height_m=0.500
target.reflectivity=0.98
target.random_seed=202608190001

# ============================================================
# 6. Mirror / Detector first-hit exclusivity
#
# 同一条光线同时存在镜面和 Detector 几何交点时，
# 只保留距离光线起点最近的第一个物理交点
# ============================================================
first_hit.enabled=true
first_hit.epsilon_m=1.0e-6

# ============================================================
# 7. Telescope obstruction
#
# 使用 MAIN_CFG 引用的机械遮挡模型
# start_epsilon_m 用于避免光线起点处的数值自相交
# ============================================================
obstruction.runtime_enabled=true
obstruction.require_config=true
obstruction.start_epsilon_m=1.0e-4

# ============================================================
# 8. Mirror reflectivity Monte Carlo
#
# 镜面反射率由 MAIN_CFG 中 efficiency.config 指定的
# mirror reflectivity curve 提供
# ============================================================
mirror.reflectivity_mc_enabled=true
mirror.require_reflectivity_curve=true
mirror.reflectivity_seed_xor=11400714819323198485

# ============================================================
# 9. Output
# ============================================================
output.save_parallel_cmos_csv=true
output.parallel_cmos_csv=parallel_cmos_hits.csv

output.save_diffuse_csv=true
output.diffuse_csv=diffuse_hits.csv

output.save_diffuse_mirror_csv=true
output.diffuse_mirror_csv=diffuse_mirror_hits.csv

output.save_diffuse_cmos_csv=true
output.diffuse_cmos_csv=diffuse_cmos_hits.csv

# ============================================================
# 10. Diagnostics
# ============================================================
diagnostics.verbose=true
diagnostics.print_cmos_frame=true
diagnostics.machine_readable_summary=true
