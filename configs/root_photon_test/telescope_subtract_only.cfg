# Telescope config for the subtract-telescope-only ROOT test.
#
# Here ROOT photon_x/y are converted by:
#   local_x_m = (photon_x - telX) * 0.01
#   local_y_m = (photon_y - telY) * 0.01
#
# No pointing rotation is applied to the photon table.  Keep telescope pointing
# at zenith so run_optical_sim's normal local-frame transform is identity.
id=0
name=ROOT_test_subtract_only
position_m=0,0,0
coordinate_system=local_test
pointing_az_deg=0
pointing_el_deg=90
focal_length_m=8.0
