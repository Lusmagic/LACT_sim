# Diagnostic ROOT photon camera test:
# subtract telescope x/y, do not rotate directions, but recenter the projected
# photon bundle on the telescope aperture before ray tracing.

telescope.config=telescope_subtract_only.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
efficiency.config=../efficiency/ideal.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg

source.mode=PhotonCsv
source.csv_path=run_logs/root_photon_test_subtract_centered/photons_local.csv
source.local_telescope_frame=true

camera.collector=none

propagation.speed_of_light_m_per_ns=0.299792458
output.mode=pixel
output.pixel_csv=run_logs/root_photon_test_subtract_centered/camera_pixels.csv
