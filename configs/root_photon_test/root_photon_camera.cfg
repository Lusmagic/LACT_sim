# Standalone ROOT photon -> perfect camera test.
#
# The ROOT file is converted first to run_logs/root_photon_test/photons_local.csv
# by python/root_photons_to_photon_csv.py.  This cfg then uses the normal
# PhotonCsv source path and the real new_camera pixel geometry.

telescope.config=telescope_test_root.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
efficiency.config=../efficiency/ideal.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg

source.mode=PhotonCsv
source.csv_path=run_logs/root_photon_test/photons_local.csv
source.local_telescope_frame=true

# Perfect camera-image test: use the true pixel map but do not apply collector
# angular response, SiPM PDE, NSB, trigger, or efficiency losses.
camera.collector=none

propagation.speed_of_light_m_per_ns=0.299792458
output.mode=pixel
output.pixel_csv=run_logs/root_photon_test/camera_pixels.csv
